<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vonkje • Dungeon Survival</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/game.css">
  <link rel="stylesheet" href="styles/inventory.css">
  <script src="js/world.js" defer></script>
  <script src="js/sprites.js" defer></script>
  <script src="js/render.js" defer></script>
  <script src="js/inventory.js" defer></script>
  <script src="js/combat.js" defer></script>
  <script src="js/save.js" defer></script>
  <script src="js/input.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <main>
    <section class="game" id="game" aria-label="Vonkje speelveld" data-area="forest">
      <header class="hud">
        <h1>Vonkje</h1>
        <div class="hud-status" aria-label="Spelstatus">
          <strong id="room-number">Bos</strong>
          <span id="hearts" role="img" aria-label="3 van 3 hartjes">♥ ♥ ♥</span>
          <span id="fireball-status">Vuurbal klaar</span>
          <span id="wood">Hout 0</span>
          <span id="key" hidden>Sleutel ontbreekt</span>
        </div>
        <div class="hud-hands" aria-label="Handen">
          <span id="hud-left-hand">J · Leeg</span>
          <span id="hud-right-hand">K · Leeg</span>
        </div>
        <div class="hud-actions">
          <button id="backpack-toggle" type="button" aria-controls="backpack" aria-expanded="false">Inventaris · Tab / B</button>
          <button id="fullscreen-toggle" type="button" aria-pressed="false">Volledig scherm</button>
        </div>
      </header>
      <div class="stage">
        <div class="room">
          <p id="action" hidden></p>
          <canvas id="dungeon" width="480" height="320" aria-label="Pixelwereld met ridder en babydraak"></canvas>
          <div id="ending" class="ending" hidden>
            <strong id="result"></strong>
            <button id="respawn" type="button" hidden>Terug naar huis</button>
          </div>
        </div>
        <aside class="inventory" aria-label="Inventaris">
          <section id="backpack" aria-label="Rugzak" hidden>
            <div class="panel-heading">
              <strong id="bag-capacity"></strong>
              <button id="close-backpack" type="button">Sluiten · Esc</button>
            </div>
            <div id="bag-items"></div>
            <div id="equip-choices" class="panel-actions" hidden>
              <button type="button" id="equip-left">Naar linkerhand</button>
              <button type="button" id="equip-right">Naar rechterhand</button>
            </div>
            <div class="equipment">
              <section aria-label="Handen">
                <strong>Handen</strong>
                <button type="button" id="left-hand"></button>
                <button type="button" id="right-hand"></button>
              </section>
              <section aria-label="Pantser">
                <strong id="armor-total"></strong>
                <button type="button" id="helmet"></button>
                <button type="button" id="chestplate"></button>
                <button type="button" id="boots"></button>
              </section>
              <section aria-label="Vonkje">
                <strong id="pet-recharge"></strong>
                <button type="button" id="pet-slot"></button>
              </section>
            </div>
            <div id="bag-recipes" class="panel-actions" aria-label="Rugzakrecepten"></div>
          </section>
          <section id="house-panel" aria-labelledby="house-title" hidden>
            <div class="panel-heading">
              <strong id="house-title"></strong>
              <button id="close-house-panel" type="button">Sluiten · E / Esc</button>
            </div>
            <div id="workbench-recipes" class="panel-actions" aria-label="Werkbankrecepten" hidden></div>
            <div id="chest-contents" hidden>
              <p>Uitwisseling per stapel. Klik op een item om het te verplaatsen.</p>
              <section aria-labelledby="chest-bag-title">
                <strong id="chest-bag-title"></strong>
                <div id="chest-bag-items" class="storage-slots"></div>
              </section>
              <section aria-labelledby="chest-slots-title">
                <strong id="chest-slots-title"></strong>
                <div id="chest-slots" class="storage-slots"></div>
              </section>
            </div>
          </section>
        </aside>
      </div>
      <footer class="controls">
        <div class="build-tools" id="build-selection" role="group" aria-label="Bouwen">
          <button id="build-fence" type="button" aria-pressed="false">1 · Hek</button>
          <button id="build-floor" type="button" aria-pressed="false">2 · Vloer</button>
          <button id="build-torch" type="button" aria-pressed="false">3 · Fakkel</button>
          <button id="build-place" type="button" disabled>F · Plaatsen</button>
        </div>
        <p id="feedback" role="status"></p>
        <div class="game-actions">
          <p><kbd>WASD</kbd> Lopen · <kbd>E</kbd> Interactie · <kbd>Spatie</kbd> Vuurbal</p>
          <button id="new-game" type="button">Nieuw spel</button>
        </div>
      </footer>
      <p id="status" class="visually-hidden" role="status"></p>
    </section>
  </main>
</body>
</html>
